html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-inline: 16px; padding-block: 12px; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--navy); display: grid; place-items: center; }

.main { display: grid; grid-template-columns: minmax(0,1fr) 390px; gap: 12px; min-height: 0; }

.toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }

.legend { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.canvas-wrap { position: relative; flex: 1; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; pointer-events: none; }

.panel { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.composer { padding: 12px; display: grid; gap: 8px; }
.composer label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
textarea { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--surface-2); min-height: 62px; }

select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; background: var(--surface-2); }

.ideas { display: flex; gap: 6px; flex-wrap: wrap; }

.tabs-card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }

.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; }

.agent-row { width: 100%; display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 7px 6px; border: 0; background: transparent; border-radius: 10px; text-align: left; }

.state { font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }

.col-title { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 2px 6px; }
.task { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; background: var(--surface-2); }
.task-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.task-title { font-weight: 600; font-size: 13px; min-width: 0; }
.task-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.badge.doing { color: var(--ok); border-color: var(--ok); }
.badge.review { color: var(--meet); border-color: var(--meet); }
.badge.done { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.badge.revisi { background: var(--warn); color: var(--surface); border-color: var(--warn); }
.badge.example { border-style: dashed; }
.result { margin-top: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; max-height: 260px; overflow-y: auto; }
.review-note { margin-top: 6px; font-size: 12px; color: var(--muted); }
.review-note b { color: var(--ink); }
.task-actions { display: flex; gap: 6px; margin-top: 6px; }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 12px; padding: 0; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 2px 12px; }

.feed-item { display: grid; grid-template-columns: 46px 1fr; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.feed-item time { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }

.chat { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.chat-head .who { flex: 1; min-width: 0; }
.chat-head b { display: block; }
.chat-head small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 600; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 88%; padding: 8px 11px; border-radius: 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--navy); color: var(--surface); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.sys { align-self: center; font-size: 12px; color: var(--muted); background: transparent; }
.chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }

@media (max-width: 960px) {

  .tabs-card { min-height: 460px; }
  .legend { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* ---------- Pathing ---------- */
const inLeft = (p) => p.x < 13;
const inMeeting = (p) => p.x > 14.8 && p.y < 7.2;
const nearestAisle = (y) => AISLES.reduce((b, a) => (Math.abs(a - y) < Math.abs(b - y) ? a : b));
function exitPts(p) {
  if (inLeft(p)) { const ay = nearestAisle(p.y); return [{ x: p.x, y: ay }, { x: 13.5, y: ay }]; }
  if (inMeeting(p)) { const wy = p.y < 4 ? 2.4 : 6.2; return [{ x: p.x, y: wy }, { x: 15.6, y: wy }, { x: 15.5, y: 4 }, { x: 13.5, y: 4 }]; }
  return [{ x: 13.5, y: p.y }];
}
function route(a, b) {
  if (inLeft(a) && inLeft(b) && nearestAisle(a.y) === nearestAisle(b.y)) {
    const ay = nearestAisle(a.y); return [{ x: a.x, y: ay }, { x: b.x, y: ay }, { x: b.x, y: b.y }];
  }
  const out = exitPts(a);
  const inn = exitPts(b).reverse();
  return [...out, ...inn, { x: b.x, y: b.y }];
}
function goTo(a, target, cb) {
  a.sitting = false;
  a.path = route({ x: a.x, y: a.y }, target);
  a.onArrive = cb || null;
}
function walkTo(a, target) { return new Promise((res) => goTo(a, target, res)); }
function goSeat(a, cb) {
  a.spot = null;
  goTo(a, a.seat, () => { a.sitting = true; a.away = false; cb && cb(); });
}
function takeSpot(list) {
  const used = new Set(agents.map((a) => a.spot).filter(Boolean));
  const free = list.filter((s) => !used.has(s));
  return free.length ? rnd(free) : rnd(list);
}

/* ---------- Behaviour ---------- */
function idleTick(a, now) {
  if (a.busy || a.reviewing || mode.meeting || mode.break) return;
  if (a.path.length || now < a.nextIdle) return;
  a.nextIdle = now + 7000 + Math.random() * 9000;
  if (a.away) {
    goSeat(a, () => { a.state = "working"; a.status = rnd(a.lines); ui(); });
    a.state = "idle"; a.status = "Balik ke meja"; ui();
    return;
  }
  const r = Math.random();
  if (r < 0.62) { a.state = "working"; a.status = rnd(a.lines); }
  else if (r < 0.82) {
    a.spot = takeSpot(SPOTS.pantry); a.away = true; a.state = "break"; a.status = "Ngopi dulu";
    goTo(a, a.spot);
  } else {
    a.spot = takeSpot(SPOTS.lounge.concat(SPOTS.wander)); a.away = true; a.state = "idle"; a.status = rnd(["Jalan-jalan bentar", "Dengerin musik", "Stretching"]);
    goTo(a, a.spot);
  }
  ui();
}

async function submitTask(text, assignee) {
  const task = { id: taskSeq++, title: text, agentId: null, status: "queued", result: "", review: null, open: true };
  tasks.unshift(task);
  ui();
  let pick = assignee;
  if (pick === "auto") {
    task.routing = true; ui();
    manager.status = "Membagi tugas baru";
    const r = await autoRoute(text);
    pick = r.id; task.routing = false;
    log(`Raka menugaskan "${short(text, 40)}" ke ${byId[pick].name}${r.why ? " (" + r.why + ")" : ""}.`);
  } else {
    log(`Tugas "${short(text, 40)}" dikirim ke ${byId[pick].name}.`);
  }
  task.agentId = pick;
  const a = byId[pick];
  a.queue.push(task);
  ui();
  if (!a.busy) work(a);
}
async function work(a) {
  a.busy = true;
  while (a.queue.length) {
    const task = a.queue.shift();
    a.state = "working"; a.status = "Menuju meja";
    if (!(a.sitting && a.x === a.seat.x && a.y === a.seat.y)) { a.spot = null; await walkTo(a, a.seat); }
    a.sitting = true; a.away = false;
    a.state = "working"; a.status = "Mengerjakan: " + task.title;
    task.status = "doing"; ui();
    task.result = await produce(a, task);
    if (a.id !== "manager") {
      task.status = "review"; a.status = "Menunggu review Raka"; ui();
      task.review = await (managerLock = managerLock.then(() => managerReview(a, task)));
    } else {
      task.review = { verdict: "Disetujui", catatan: "Dikerjakan langsung oleh AI Manager." };
    }
    task.status = "done";
    a.status = "Selesai: " + task.title;
    log(`${a.name} menyelesaikan "${short(task.title, 40)}". Review: ${task.review.verdict}.`);
    ui();
  }
  a.busy = false;
  a.nextIdle = performance.now() + 6000;
}
async function managerReview(a, task) {
  const wasBusy = manager.busy;
  if (!wasBusy) {
    manager.reviewing = true; manager.state = "working"; manager.status = "Menuju meja " + a.name;
    await walkTo(manager, { x: a.seat.x + 0.75, y: a.seat.y + 0.15 });
  }
  manager.status = "Review hasil " + a.name; ui();
  const r = await review(a, task);
  if (!wasBusy) {
    manager.status = "Balik ke meja";
    await walkTo(manager, manager.seat);
    manager.sitting = true; manager.away = false; manager.reviewing = false;
    manager.status = rnd(manager.lines);
  }
  return r;
}

/* ---------- Canvas ---------- */
const cv = $("cv"), ctx = cv.getContext("2d"), wrap = $("wrap");
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;
const C = {};
const TOKENS = ["bg","surface","ink","muted","line","navy","accent","ok","warn","meet","idle","floor-a","floor-b","floor-meet","floor-pantry","wall-top","wall-l","wall-r","window","desk-top","desk-l","desk-r","chair","screen","glass","glass-edge","label-bg","label-ink","label-sub","shadow","font-body","font-display","font-mono"];
function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  TOKENS.forEach((t) => { C[t] = cs.getPropertyValue("--" + t).trim(); });
}
readTokens();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTokens);
new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function resize() {
  const r = wrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / 1270, H / 770);
  OX = W / 2 - 3 * 32 * S;
  OY = (H - 740 * S) / 2 + 118 * S;
}
new ResizeObserver(resize).observe(wrap);
resize();

const iso = (x, y, z = 0) => ({ x: OX + (x - y) * 32 * S, y: OY + (x + y) * 16 * S - z * S });
function poly(pts, fill, stroke) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function box(x, y, w, d, h, z0, top, left, right) {
  const p = iso;
  poly([p(x, y + d, z0), p(x + w, y + d, z0), p(x + w, y + d, z0 + h), p(x, y + d, z0 + h)], left);
  poly([p(x + w, y, z0), p(x + w, y + d, z0), p(x + w, y + d, z0 + h), p(x + w, y, z0 + h)], right);
  poly([p(x, y, z0 + h), p(x + w, y, z0 + h), p(x + w, y + d, z0 + h), p(x, y + d, z0 + h)], top);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawFloor() {
  for (let gx = 0; gx < 22; gx++) for (let gy = 0; gy < 16; gy++) {
    let c = (gx + gy) % 2 ? C["floor-a"] : C["floor-b"];
    if (gx >= 15 && gy >= 1 && gy < 7) c = (gx + gy) % 2 ? C["floor-meet"] : C["floor-a"];
    if (gx >= 15 && gy >= 9) c = (gx + gy) % 2 ? C["floor-pantry"] : C["floor-b"];
    poly([iso(gx, gy), iso(gx + 1, gy), iso(gx + 1, gy + 1), iso(gx, gy + 1)], c);
  }
  // corridor runner
  poly([iso(13, 0.2), iso(14, 0.2), iso(14, 16), iso(13, 16)], C["line"]);
  floorText("AREA KERJA", 2.2, 15.2);
  floorText("RUANG RAPAT", 15.3, 6.6);
  floorText("PANTRY & LOUNGE", 15.3, 9.6);
}
function floorText(t, x, y) {
  const o = iso(x, y);
  ctx.save(); ctx.translate(o.x, o.y);
  ctx.transform(32 * S / 40, 16 * S / 40, -32 * S / 40, 16 * S / 40, 0, 0);
  ctx.font = `700 13px ${C["font-body"]}`; ctx.fillStyle = C["muted"]; ctx.globalAlpha = 0.55;
  ctx.fillText(t, 0, 0);
  ctx.restore();
}
function drawWalls() {
  box(-0.3, -0.3, 22.3, 0.3, 74, 0, C["wall-top"], C["wall-l"], C["wall-r"]);
  box(-0.3, 0, 0.3, 16, 74, 0, C["wall-top"], C["wall-l"], C["wall-r"]);
  // windows on back wall
  for (const wx of [8.4, 10.6, 12.8, 15.3, 20.2]) {
    poly([iso(wx, 0, 24), iso(wx + 1.5, 0, 24), iso(wx + 1.5, 0, 60), iso(wx, 0, 60)], C["window"]);
  }
  for (const wy of [3, 6.5, 10, 13.2]) {
    poly([iso(0, wy, 24), iso(0, wy + 1.6, 24), iso(0, wy + 1.6, 60), iso(0, wy, 60)], C["window"]);
  }
  // sign
  const o = iso(1.2, 0, 62);
  ctx.save(); ctx.translate(o.x, o.y); ctx.transform(1, 0.5, 0, 1, 0, 0);
  const w = 6.2 * 32 * S, h = 40 * S;
  rrect(0, 0, w, h, 5 * S); ctx.fillStyle = C["surface"]; ctx.fill();
  ctx.lineWidth = 2 * S; ctx.strokeStyle = C["accent"]; ctx.stroke();
  ctx.font = `800 ${21 * S}px ${C["font-display"]}`; ctx.fillStyle = C["navy"];
  ctx.fillText("Intelligo", 12 * S, 25 * S);
  const iw = ctx.measureText("Intelligo").width;
  ctx.fillStyle = C["accent"]; ctx.fillText(" AI Office", 12 * S + iw, 25 * S);
  ctx.font = `600 ${7.5 * S}px ${C["font-body"]}`; ctx.fillStyle = C["muted"];
  ctx.fillText("KANTOR AI · BANDUNG", 12 * S, 35 * S);
  ctx.restore();
  // TV in meeting room
  const t = iso(16.9, 0, 58);
  ctx.save(); ctx.translate(t.x, t.y); ctx.transform(1, 0.5, 0, 1, 0, 0);
  const tw = 3 * 32 * S, th = 32 * S;
  ctx.fillStyle = C["navy"]; ctx.fillRect(0, 0, tw, th);
  ctx.fillStyle = C["surface"]; ctx.font = `600 ${6 * S}px ${C["font-body"]}`; ctx.fillText("PENDAFTARAN / MINGGU", 6 * S, 9 * S);
  const bars = [0.4, 0.55, 0.5, 0.7, 0.65, 0.85];
  bars.forEach((b, i) => { ctx.fillStyle = i === bars.length - 1 ? C["accent"] : C["screen"] === C["navy"] ? "rgba(255,255,255,.55)" : C["screen"]; ctx.fillRect(6 * S + i * 14 * S, th - 4 * S - b * 18 * S, 9 * S, b * 18 * S); });
  ctx.restore();
}

function objects() {
  const list = [];
  agents.forEach((a) => {
    const x0 = a.cx - 0.7, y0 = a.dy;
    list.push({ k: a.cx + y0 + 0.8, draw: () => drawDesk(a, x0, y0) });
    list.push({ k: a.cx + a.seat.y - 0.05, draw: () => box(a.cx - 0.22, a.seat.y - 0.12, 0.44, 0.38, 9, 0, C["chair"], C["chair"], C["chair"]) });
    list.push({ k: a.x + a.y + 0.01, draw: () => drawAgent(a), agent: a });
  });
  // meeting table
  list.push({ k: 16.6 + 2.8 + 3 + 1, draw: () => box(16.6, 3, 2.8, 2, 15, 0, C["desk-top"], C["desk-l"], C["desk-r"]) });
  // glass walls
  const segX = [[1, 2], [2, 3], [3, 3.5], [4.5, 5.5], [5.5, 6.5], [6.5, 7]];
  segX.forEach(([a, b]) => list.push({ k: 15 + (a + b) / 2, draw: () => glass(iso(15, a), iso(15, b)) }));
  for (let x = 15; x < 21; x++) list.push({ k: x + 0.5 + 7, draw: () => glass(iso(x, 7), iso(x + 1, 7)) });
  // pantry
  list.push({ k: 20.3 + 9.8 + 3, draw: () => { box(20.3, 9.8, 0.7, 3.4, 22, 0, C["desk-top"], C["desk-l"], C["desk-r"]); box(20.45, 10.3, 0.45, 0.5, 15, 22, C["ink"], C["chair"], C["chair"]); box(20.5, 11.8, 0.35, 0.35, 6, 22, C["accent"], C["accent"], C["accent"]); } });
  list.push({ k: 15.6 + 14.2 + 1, draw: () => { box(15.6, 14.2, 2.4, 0.3, 22, 0, C["navy"], C["navy"], C["navy"]); box(15.6, 13.6, 2.4, 0.8, 10, 0, C["meet"], C["navy"], C["navy"]); } });
  list.push({ k: 18.2 + 12.6 + 0.8, draw: () => box(18.2, 12.6, 0.8, 0.8, 14, 0, C["desk-top"], C["desk-l"], C["desk-r"]) });
  // plants
  [[0.6, 15.2], [12.4, 0.6], [14.4, 0.6], [21.2, 15.2], [14.4, 15.2], [21.2, 8.4], [0.6, 0.6]].forEach(([x, y]) => list.push({ k: x + y + 0.4, draw: () => plant(x, y) }));
  return list.sort((p, q) => p.k - q.k);
}
function glass(a, b) {
  const h = 52 * S;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x, b.y - h); ctx.lineTo(a.x, a.y - h); ctx.closePath();
  ctx.fillStyle = C["glass"]; ctx.fill();
  ctx.strokeStyle = C["glass-edge"]; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y - h); ctx.lineTo(b.x, b.y - h); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, a.y - h); ctx.stroke();
}
function plant(x, y) {
  box(x - 0.2, y - 0.2, 0.4, 0.4, 12, 0, C["desk-l"], C["desk-r"], C["desk-r"]);
  const p = iso(x, y, 24);
  ctx.fillStyle = "#3f9a5a"; ctx.beginPath(); ctx.arc(p.x, p.y, 11 * S, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#5cb874"; ctx.beginPath(); ctx.arc(p.x - 4 * S, p.y - 5 * S, 7 * S, 0, Math.PI * 2); ctx.fill();
}
function drawDesk(a, x0, y0) {
  box(x0, y0, 1.4, 0.8, 18, 0, C["desk-top"], C["desk-l"], C["desk-r"]);
  // monitor
  const on = a.sitting && a.state === "working";
  const m0 = iso(a.cx - 0.35, y0 + 0.18, 20), m1 = iso(a.cx + 0.35, y0 + 0.18, 20);
  const h = 17 * S;
  ctx.beginPath(); ctx.moveTo(m0.x, m0.y); ctx.lineTo(m1.x, m1.y); ctx.lineTo(m1.x, m1.y - h); ctx.lineTo(m0.x, m0.y - h); ctx.closePath();
  ctx.fillStyle = on ? C["screen"] : C["chair"]; ctx.fill();
  if (on) {
    ctx.strokeStyle = C["accent"]; ctx.lineWidth = 1.2 * S; ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const t = 0.25 + i * 0.22, len = 0.3 + ((i * 37 + a.cx * 10) % 5) / 10;
      const pa = { x: m0.x + (m1.x - m0.x) * 0.15, y: m0.y + (m1.y - m0.y) * 0.15 - h * (1 - t) };
      ctx.moveTo(pa.x, pa.y); ctx.lineTo(pa.x + (m1.x - m0.x) * len, pa.y + (m1.y - m0.y) * len);
    }
    ctx.stroke();
  }
  // stand + keyboard
  box(a.cx - 0.05, y0 + 0.2, 0.1, 0.06, 2, 18, C["chair"], C["chair"], C["chair"]);
  box(a.cx - 0.25, y0 + 0.45, 0.5, 0.15, 1.5, 18, C["line"], C["line"], C["line"]);
}
function stateColor(s) { return s === "working" ? C["ok"] : s === "break" ? C["warn"] : s === "meeting" ? C["meet"] : C["idle"]; }
function drawAgent(a) {
  const p = iso(a.x, a.y);
  const walking = a.path.length > 0;
  const bob = walking ? Math.abs(Math.sin(a.step * 2)) * 2.2 * S : 0;
  const sit = a.sitting ? 5 * S : 0;
  const sel = a.id === selectedId || a.id === hoverId;
  ctx.fillStyle = C["shadow"]; ctx.beginPath(); ctx.ellipse(p.x, p.y, 10 * S, 4.5 * S, 0, 0, Math.PI * 2); ctx.fill();
  if (sel) { ctx.strokeStyle = C["accent"]; ctx.lineWidth = 2 * S; ctx.beginPath(); ctx.ellipse(p.x, p.y, 14 * S, 6.5 * S, 0, 0, Math.PI * 2); ctx.stroke(); }
  const base = p.y - bob + sit;
  if (!a.sitting) {
    const sw = walking ? Math.sin(a.step * 2) * 2.5 * S : 0;
    ctx.fillStyle = "#273352";
    ctx.fillRect(p.x - 5 * S + sw, base - 10 * S, 4 * S, 10 * S);
    ctx.fillRect(p.x + 1 * S - sw, base - 10 * S, 4 * S, 10 * S);
  }
  rrect(p.x - 8 * S, base - 25 * S, 16 * S, 16 * S, 5 * S); ctx.fillStyle = a.color; ctx.fill();
  ctx.fillStyle = a.skin; ctx.beginPath(); ctx.arc(p.x, base - 31 * S, 6.5 * S, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = a.hair; ctx.beginPath(); ctx.arc(p.x, base - 32.5 * S, 6.8 * S, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  a._hit = { x: p.x, y: base - 20 * S, r: 18 * S };
  a._head = { x: p.x, y: base - 40 * S };
}
function drawLabel(a) {
  if (!a._head) return;
  const fs = Math.max(8.5, Math.min(11, 10.5 * S * 1.15));
  const t1 = a.role, t2 = short(a.status, 24);
  ctx.font = `700 ${fs}px ${C["font-body"]}`;
  const w1 = ctx.measureText(t1).width;
  ctx.font = `500 ${fs - 1}px ${C["font-body"]}`;
  const w2 = ctx.measureText(t2).width;
  const pad = 6, w = Math.max(w1 + 14, w2) + pad * 2, h = fs * 2 + 9;
  const x = a._head.x - w / 2, y = a._head.y - h - 2;
  ctx.save();
  ctx.shadowColor = C["shadow"]; ctx.shadowBlur = 6; ctx.shadowOffsetY = 1;
  rrect(x, y, w, h, 7); ctx.fillStyle = C["label-bg"]; ctx.fill();
  ctx.restore();
  if (a.id === selectedId) { rrect(x, y, w, h, 7); ctx.strokeStyle = C["accent"]; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.fillStyle = stateColor(a.state); ctx.beginPath(); ctx.arc(x + pad + 3.5, y + 4 + fs * 0.55, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.font = `700 ${fs}px ${C["font-body"]}`; ctx.fillStyle = C["label-ink"]; ctx.fillText(t1, x + pad + 11, y + 3 + fs);
  ctx.font = `500 ${fs - 1}px ${C["font-body"]}`; ctx.fillStyle = C["label-sub"]; ctx.fillText(t2, x + pad, y + 5 + fs * 2);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  agents.forEach((a) => {
    if (a.path.length) {
      const tgt = a.path[0];
      const dx = tgt.x - a.x, dy = tgt.y - a.y, dist = Math.hypot(dx, dy);
      const sp = 2.3 * dt;
      a.step += dt * 6;
      if (dist <= sp) { a.x = tgt.x; a.y = tgt.y; a.path.shift(); if (!a.path.length && a.onArrive) { const cb = a.onArrive; a.onArrive = null; cb(); ui(); } }
      else { a.x += dx / dist * sp; a.y += dy / dist * sp; }
    }
    idleTick(a, now);
  });
  if (mode.meeting && now > mode.meetingTimer) setMeeting(false);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C["surface"]; ctx.fillRect(0, 0, W, H);
  drawFloor();
  drawWalls();
  objects().forEach((o) => o.draw());
  if (mode.labels) {
    agents.slice().sort((p, q) => (p.x + p.y) - (q.x + q.y)).forEach(drawLabel);
  } else if (selectedId) drawLabel(byId[selectedId]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function pickAgent(ev) {
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let best = null, bd = Infinity;
  agents.forEach((a) => {
    if (!a._hit) return;
    const d = Math.hypot(mx - a._hit.x, (my - a._hit.y) * 0.8);
    if (d < a._hit.r && d < bd) { bd = d; best = a; }
  });
  return best;
}
cv.addEventListener("mousemove", (e) => { const a = pickAgent(e); hoverId = a ? a.id : null; cv.style.cursor = a ? "pointer" : "default"; });
cv.addEventListener("mouseleave", () => { hoverId = null; });
cv.addEventListener("click", (e) => { const a = pickAgent(e); if (a) openChat(a.id); });

/* ---------- UI rendering ---------- */
let uiQueued = false;
function ui() { if (uiQueued) return; uiQueued = true; requestAnimationFrame(() => { uiQueued = false; renderAll(); }); }
const stateText = { working: "Bekerja", break: "Istirahat", meeting: "Rapat", idle: "Santai" };
let openBoardIds = new Set();

function renderAll() {
  const count = (s) => agents.filter((a) => a.state === s).length;
  $("stWork").textContent = count("working");
  $("stBreak").textContent = count("break");
  $("stMeet").textContent = count("meeting");
  $("stDone").textContent = tasks.filter((t) => t.status === "done" && !t.example).length;
  $("nTasks").textContent = tasks.filter((t) => t.status !== "done").length || "";
  const mc = $("modeChip");
  mc.innerHTML = sampleState === "ready" ? '<span class="dot" style="background:var(--ok)"></span>AI aktif'
    : sampleState === "demo" ? '<span class="dot" style="background:var(--warn)"></span>Mode demo'
    : '<span class="dot" style="background:var(--idle)"></span>Menyambungkan AI…';
  mc.title = sampleState === "demo" ? "AI tidak tersedia di tampilan ini. Agen memakai jawaban contoh." : "";

  $("pane-team").innerHTML = agents.map((a) => `
    <button class="agent-row" type="button" data-agent="${a.id}">
      <span class="avatar" style="background:${a.color}">${esc(a.name[0])}</span>
      <span class="who"><b>${esc(a.name)} · ${esc(a.role)}</b><small>${esc(a.status)}</small></span>
      <span class="state"><span class="dot" style="background:${stateColor(a.state)}"></span>${a.queue.length ? a.queue.length + " antre" : stateText[a.state]}</span>
    </button>`).join("");

  const cols = [
    ["Dikerjakan", tasks.filter((t) => t.status === "queued" || t.status === "doing" || t.status === "review")],
    ["Selesai", tasks.filter((t) => t.status === "done")]
  ];
  const board = $("pane-board");
  const scroll = board.scrollTop;
  board.innerHTML = cols.map(([name, list]) => `
    <div class="col-title"><span>${name}</span><span>${list.length}</span></div>
    ${list.length ? list.map(taskCard).join("") : `<div class="empty">${name === "Dikerjakan" ? "Belum ada tugas berjalan. Kirim tugas dari kotak di atas." : "Belum ada tugas selesai."}</div>`}`).join("");
  board.scrollTop = scroll;

  $("pane-feed").innerHTML = feed.map((f) => `<div class="feed-item"><time>${f.t}</time><div>${esc(f.text)}</div></div>`).join("");

  if (selectedId) {
    const a = byId[selectedId];
    $("chatRole").textContent = a.role + " · " + a.status;
  }
}
function taskCard(t) {
  const a = t.agentId ? byId[t.agentId] : null;
  let badge;
  if (t.status === "queued") badge = `<span class="badge">${t.routing ? "Dibagi" : "Antri"}</span>`;
  else if (t.status === "doing") badge = `<span class="badge doing">Dikerjakan</span>`;
  else if (t.status === "review") badge = `<span class="badge review">Review</span>`;
  else badge = t.review && t.review.verdict === "Perlu revisi" ? `<span class="badge revisi">Revisi</span>` : `<span class="badge done">Selesai</span>`;
  if (t.example) badge = `<span class="badge example">Contoh</span>` + badge;
  const open = t.status !== "done" || openBoardIds.has(t.id);
  const body = t.result
    ? `<div class="result">${esc(t.result)}</div>`
    : (t.status === "doing" ? `<div class="result" style="color:var(--muted)">Sedang menulis…</div>` : "");
  const rev = t.review ? `<div class="review-note"><b>Raka: ${esc(t.review.verdict)}.</b> ${esc(t.review.catatan)}</div>` : "";
  return `<div class="task">
    <div class="task-head"><div class="task-title">${esc(t.title)}</div><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${badge}</div></div>
    <div class="task-meta">${a ? esc(a.name + " · " + a.role) : "Raka sedang memilih penerima"}</div>
    ${open ? body + rev : ""}
    <div class="task-actions">
      ${t.status === "done" ? `<button class="link" type="button" data-toggle="${t.id}">${open ? "Sembunyikan hasil" : "Lihat hasil"}</button>` : ""}
      ${t.result && t.status === "done" ? `<button class="link" type="button" data-copy="${t.id}">Salin</button>` : ""}
    </div>
  </div>`;
}

function renderChat() {
  const a = byId[selectedId];
  if (!a) return;
  const box = $("msgs");
  const intro = `<div class="msg sys">${esc(a.name)} siap membantu. Tanyakan apa saja seputar ${esc(a.role.toLowerCase())}.</div>`;
  box.innerHTML = intro + a.chat.map((m) => `<div class="msg ${m.role === "user" ? "me" : "ai"}">${m.pending ? '<span style="color:var(--muted)">Sedang mengetik…</span>' : esc(m.content)}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}
function openChat(id) {
  selectedId = id;
  const a = byId[id];
  $("chatAvatar").textContent = a.name[0];
  $("chatAvatar").style.background = a.color;
  $("chatName").textContent = a.name;
  $("chatRole").textContent = a.role + " · " + a.status;
  $("tabsCard").hidden = true;
  $("chatCard").hidden = false;
  $("assignee").value = id;
  renderChat();
  $("chatInput").focus({ preventScroll: true });
}
function closeChat() {
  selectedId = null;
  $("chatCard").hidden = true;
  $("tabsCard").hidden = false;
}

/* ---------- Wiring ---------- */
$("assignee").innerHTML = `<option value="auto">Otomatis: Raka yang membagi</option>` + agents.map((a) => `<option value="${a.id}">${esc(a.name)} · ${esc(a.role)}</option>`).join("");
$("ideas").innerHTML = IDEAS.map((t, i) => `<button class="idea" type="button" data-idea="${i}">${esc(t)}</button>`).join("");
$("ideas").addEventListener("click", (e) => { const b = e.target.closest("[data-idea]"); if (b) { $("taskText").value = IDEAS[+b.dataset.idea]; $("taskText").focus(); } });

$("taskForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("taskText").value.trim();
  if (!text) { $("taskText").focus(); return; }
  $("taskText").value = "";
  submitTask(text, $("assignee").value);
  if (selectedId) closeChat();
  selectTab("board");
});
$("taskText").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("taskForm").requestSubmit(); });

function selectTab(name) {
  ["team", "board", "feed"].forEach((t) => {
    $("tab-" + t).setAttribute("aria-selected", String(t === name));
    $("pane-" + t).hidden = t !== name;
  });
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => selectTab(b.dataset.tab)));
$("pane-team").addEventListener("click", (e) => { const b = e.target.closest("[data-agent]"); if (b) openChat(b.dataset.agent); });
$("pane-board").addEventListener("click", (e) => {
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const id = +tg.dataset.toggle; openBoardIds.has(id) ? openBoardIds.delete(id) : openBoardIds.add(id); renderAll(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const t = tasks.find((x) => x.id === +cp.dataset.copy);
    const done = () => { cp.textContent = "Tersalin"; setTimeout(() => (cp.textContent = "Salin"), 1500); };
    try {
      navigator.clipboard.writeText(t.result).then(done, () => { cp.textContent = "Salin manual"; });
    } catch (err) { cp.textContent = "Salin manual"; }
  }
});
$("chatBack").addEventListener("click", closeChat);
$("chatForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("chatInput").value.trim();
  if (!v) return;
  $("chatInput").value = "";
  sendChat(v);
});
$("btnMeet").addEventListener("click", () => setMeeting(!mode.meeting));
$("btnBreak").addEventListener("click", () => setBreak(!mode.break));
$("btnLabels").addEventListener("click", () => { mode.labels = !mode.labels; $("btnLabels").setAttribute("aria-pressed", String(mode.labels)); });

function tickClock() { $("clock").textContent = nowHM() + " WIB"; }
tickClock(); setInterval(tickClock, 15000);

renderAll();
connectAI();
})();
</script>
